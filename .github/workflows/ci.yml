name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild generated main.js
        run: node scripts/build-obsidian.mjs
      - name: Ensure main.js is up to date
        run: git diff --exit-code main.js
      - name: Run tests
        run: |
          npm test > /tmp/npm-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 25 /tmp/npm-test.log | sed 's/^/::error::/'
          fi
          exit "$status"
