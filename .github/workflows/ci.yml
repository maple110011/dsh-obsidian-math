name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild generated main.js
        run: node scripts/build-obsidian.mjs
      - name: Ensure main.js is up to date
        run: git diff --exit-code main.js
      - name: Run tests
        run: |
          npm test 2>&1 | tee /tmp/npm-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c "import sys; s=open('/tmp/npm-test.log').read(); s=s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error::' + s[-2500:])"
          fi
          exit "$status"
