name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the primary target platform (CRLF handling in
    # scripts/build-obsidian.mjs, win32 branches in dsh/install.mjs), and the
    # project's own notes record Windows-only failures — so the suite runs on
    # both, with the rebuild gate pinned to Linux to keep the artifact bytes
    # deterministic.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Version consistency
        run: node scripts/check-version-consistency.mjs
      - name: Rebuild generated main.js
        run: node scripts/build-obsidian.mjs
      - name: Ensure main.js is up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code main.js
      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm test 2>&1 | tee /tmp/npm-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Report the FAILED assertions FIRST (and a longer tail). The plain `s[-2500:]` tail hid the
            # one failing assertion behind ~470 lines of passing ones — on 2026-09-27 that cost an extra
            # CI round trip just to learn which check was red.
            python3 -c "s=open('/tmp/npm-test.log').read(); nl=chr(10); bad=[l for l in s.split(nl) if '[FAIL]' in l]; e=lambda t: t.replace('%','%25').replace(chr(13),'%0D').replace(nl,'%0A'); print('::error::' + e(nl.join(bad) + nl + '--- tail ---' + nl + s[-6000:]))"
          fi
          exit "$status"
      - name: Run tests (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: npm test
