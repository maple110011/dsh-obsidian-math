name: Release assets

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild generated main.js
        run: node scripts/build-obsidian.mjs
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: awk '/^## \[/{n++} n==1{print}' CHANGELOG.md > release-notes.md
      - name: Create GitHub release with Obsidian assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            main.js
            manifest.json
            styles.css
