name: Publish to npm

# npm and the GitHub Release are two independent distributions: this workflow
# publishes `dsh-math-memory` (dsh preset/profile/installer, see package.json
# `files`) to the npm registry on a version tag; release.yml publishes the
# Obsidian plugin (main.js/manifest.json/styles.css) as a GitHub Release. Both
# share one version tag and one version number.
#
# AUTHENTICATION: trusted publishing (OIDC) — no long-lived token.
# The 2FA-bypass granular token this used to send is being deprecated
# (github.blog/changelog 2026-07-08 + 2026-07-31: such tokens can no longer do
# account/package management, and direct publishing ends around 2027-01).
# Publishing now exchanges the workflow's OIDC token for a short-lived
# credential, so there is no secret to rotate, expire, or leak.
#
# Required npm-side setup (one-off, interactive 2FA — cannot be automated):
#   npmjs.com → package `dsh-math-memory` → Settings → Trusted Publisher →
#   GitHub Actions, with
#     Organization or user : maple110011
#     Repository           : dsh-obsidian-math
#     Workflow filename    : npm-publish.yml     (must match this file's name)
#     Environment          : (leave empty)
# Without it the Publish step fails with 404/401; the diagnostics step right
# above it says which.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Least privilege: publishing needs no repository write access, and the OIDC
# exchange requires `id-token: write`. `issues: write` is used only on the
# failure path, to publish the registry's own error text where it can be read
# without repo admin rights (job logs need admin; issues do not).
permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x. Pinned to
      # the 11 line deliberately: npm 12 turns on the install-time security
      # defaults (dependency lifecycle scripts no longer run unless allowlisted),
      # which would silently drop esbuild's postinstall binary download here.
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          npm install -g npm@11
          npm --version
      - name: Install deps
        run: npm ci
      # The tag must equal the published version, otherwise `npm publish` either
      # fails as already-published or ships a build whose version contradicts the
      # tag the release was cut from.
      - name: Version consistency (including the tag)
        run: node scripts/check-version-consistency.mjs --tag "$GITHUB_REF_NAME"
      - name: Run tests
        run: npm test
      # Diagnostics BEFORE the publish attempt: a rejected publish reports only a
      # non-zero exit code, which says nothing about whether the runner minted an
      # OIDC token, whether the trusted publisher is configured, or whether npm is
      # new enough to use it. Never fails the run — it only leaves the answer in
      # the log.
      - name: Registry / OIDC diagnostics
        run: |
          echo "npm: $(npm --version)   registry: $(npm config get registry)"
          echo "id-token endpoint: ${ACTIONS_ID_TOKEN_REQUEST_URL:+available}${ACTIONS_ID_TOKEN_REQUEST_URL:-MISSING (needs permissions: id-token: write)}"
          echo -n "whoami: "
          npm whoami --registry=https://registry.npmjs.org || echo "(no token — expected: publishing goes through trusted publishing)"
      # Print the claims npm matches against the stored trusted-publisher config
      # (repository / job_workflow_ref = repo + workflow FILENAME / environment).
      # A 403 "OIDC permission denied for this action" almost always means one of
      # these differs from what npmjs.com has — usually an environment, or a
      # filename typo. Best effort: never fails the run.
      - name: Decode the OIDC token claims
        run: |
          set +e
          : > oidc-claims.txt
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "no id-token endpoint (permissions: id-token: write missing?)" >> oidc-claims.txt
            exit 0
          fi
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',(d)=>{s+=d});process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).value||'')}catch{process.stdout.write('')}})")
          node -e '
            const token = process.argv[1] || "";
            const part = token.split(".")[1];
            if (!part) { console.log("no id-token returned"); process.exit(0); }
            const claims = JSON.parse(Buffer.from(part.replace(/-/g, "+").replace(/_/g, "/"), "base64").toString("utf8"));
            for (const key of ["repository", "repository_owner", "job_workflow_ref", "workflow_ref", "environment", "event_name", "ref", "ref_type", "aud", "sub"]) {
              if (claims[key] !== undefined) console.log(key + " = " + claims[key]);
            }
          ' "$token" >> oidc-claims.txt
          cat oidc-claims.txt
      - name: Publish (trusted publishing, no long-lived token)
        id: publish
        continue-on-error: true
        run: |
          # `set -o pipefail` is load-bearing: without it the pipeline's status is
          # tee's (0), so a failed publish reported SUCCESS and the failure
          # summary below never ran.
          set -o pipefail
          npm publish --provenance 2>&1 | tee publish.log
      # An exit code of 0 does NOT mean the version is public: with staged
      # publishing the upload waits for a human 2FA approval, and the public
      # registry then has nothing — a green pipeline that ships nothing, the same
      # failure mode as the tee masking above. Verify the registry's OWN state
      # (declared vs effective).
      - name: Verify the version is public on the registry
        id: verify
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-math-memory@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "verified: dsh-math-memory@${version} is public on registry.npmjs.org"
              exit 0
            fi
            sleep 15
          done
          {
            echo "npm publish exited 0 but dsh-math-memory@${version} is NOT on the public registry."
            echo ""
            echo "Most likely: the trusted publisher allows only STAGED publishing, so the"
            echo "upload is waiting for a human 2FA approval — npmjs.com → package"
            echo "dsh-math-memory → 'Staged publishes' → approve — or change the trusted"
            echo "publisher configuration so 'npm publish' is an allowed action."
            echo ""
            echo '```'
            tail -25 publish.log || true
            echo '```'
          } | tee verify-failure.txt
          exit 1
      # Job summaries are readable in the run page without repo admin rights, so
      # the registry's own error text (404 = no trusted publisher configured,
      # 403 = a claim mismatch, 401 = OIDC not accepted) lands where whoever
      # re-runs the job can see it.
      #
      # NOTE the ordering: these steps must NOT fail before the next one runs.
      # A failing step skips the steps after it, and a custom `if:` does not
      # rescue them (GitHub evaluates later steps with an implicit success()), so
      # filing the issue has to happen before the job is failed on purpose.
      - name: Publish failure summary
        if: steps.publish.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          {
            echo "## npm publish did not ship"
            echo ""
            if [ "${{ steps.verify.outcome }}" = "failure" ]; then
              cat verify-failure.txt || true
            else
              echo "Registry error (last 30 lines of publish.log):"
              echo ""
              echo '```'
              tail -30 publish.log || true
              echo '```'
            fi
            echo ""
            echo "Checklist: (1) Trusted Publisher configured on npmjs.com for \`dsh-math-memory\`"
            echo "→ GitHub Actions, repo \`maple110011/dsh-obsidian-math\`, workflow filename \`npm-publish.yml\`,"
            echo "environment EMPTY, and \`npm publish\` among the allowed actions;"
            echo "(2) \`npm --version\` above is >= 11.5.1; (3) the tag equals \`package.json\` version."
          } >> "$GITHUB_STEP_SUMMARY"
      # Also open an issue with the same text: reading a job log requires repo
      # admin rights, so otherwise a rejected publish is invisible to everyone
      # except the person who can already open the run page. Re-running the same
      # tag comments on the existing issue instead of filing a new one.
      - name: Publish failure issue
        if: steps.publish.outcome == 'failure' || steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Tag \`${GITHUB_REF_NAME}\` (commit \`${GITHUB_SHA:0:7}\`) did not reach npm."
            echo ""
            if [ "${{ steps.verify.outcome }}" = "failure" ]; then
              cat verify-failure.txt || true
            else
              echo '```'
              tail -30 publish.log || true
              echo '```'
            fi
            echo ""
            echo "OIDC claims this run presented (compare with the stored trusted publisher):"
            echo ""
            echo '```'
            cat oidc-claims.txt 2>/dev/null || echo "(not captured)"
            echo '```'
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > publish-issue.md
          existing=$(gh issue list --state open --search "npm publish failed for ${GITHUB_REF_NAME} in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file publish-issue.md || true
          else
            gh issue create --title "npm publish failed for ${GITHUB_REF_NAME}" --body-file publish-issue.md || true
          fi
      # Last step on purpose: fail the job only after the report is filed, so
      # "Re-run failed jobs" stays available.
      - name: Fail the job when nothing shipped
        if: steps.publish.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1
