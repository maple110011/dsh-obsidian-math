# Obsidian-mode patch overlay applied by the Obsidian plugin as an extra
# `dsh --patch` layer (or manually for pure CLI use). This file is
# plugin-owned and always refreshed on update; user edits belong in
# `cordis.patch.yml`.
#
# Auto-register the vault as a workspace so the web UI shows it in the
# workspace picker immediately and never forces a directory-selection flow
# inside the Obsidian iframe.
- insert:
    - id: math-memory-workspace
      name: ./math-memory-workspace.mjs
      config:
        vaultPath: !!js process.env.DSH_WORKSPACE_ROOT ?? process.env.DSH_OBSIDIAN_VAULT
    - id: math-memory-panel
      name: ./math-memory-panel.mjs

# The skin manager writes a global patch ($DSH_HOME/cordis.patch.yml) that
# inserts the ACTIVE web skin into EVERY profile. The obsidian profile
# intentionally lets it apply: the plugin mirrors every @linxin666 package
# from the web profile's node_modules via junctions (syncGlobalPackageLinks),
# so the skin package always resolves and the obsidian web UI follows the
# same skin the user picked for the main web profile. No id lists to keep.
#
# The skin CENTER UI (ui-skin-center + its settings card host
# ui-web-ui-settings) is optional and controlled by the Obsidian plugin's
# "启用皮肤中心" setting: when enabled, the plugin appends an extra `insert:`
# block for those two packages to THIS file at runtime (and only when a web
# profile exists to mirror them from). This base file mounts neither, so the
# default boot stays independent of the dsh-web-ui plugin family.
