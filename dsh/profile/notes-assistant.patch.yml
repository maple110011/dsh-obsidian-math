# Obsidian-mode patch overlay applied by the Obsidian plugin as an extra
# `dsh --patch` layer (or manually for pure CLI use). This file is
# plugin-owned and always refreshed on update; user edits belong in
# `cordis.patch.yml`.
#
# Auto-register the vault as a workspace so the web UI shows it in the
# workspace picker immediately and never forces a directory-selection flow
# inside the Obsidian iframe.
#
# `math-memory-client-panel` is the BROWSER half of the memory panel (its host
# half is `math-memory-panel.mjs` just above). It is what makes the sidebar
# usable for mentioning notes: it publishes `window.__dshMentionInsert` and
# subscribes to the plugin's `/mention-stream`, so a note dragged out of the
# file explorer lands in the composer as `@path`. Without this row the drag is
# detected and the path is POSTed, but nothing ever receives it.
#
# THIS FILE IS THE ONLY PLACE THAT ROW MAY LIVE. 2026-09-21: the installer used
# to append the row to a patch file at install time, but the plugin REGENERATES
# this overlay from its embedded copy at every service start
# (`buildNotesAssistantPatch`), so an appended row survived only until the next
# boot — the feature was silently absent in exactly the configuration it was
# built for, while the package sat unused in `node_modules`. Keep the row here
# (it is embedded into `main.js` by scripts/build-obsidian.mjs) and let
# `dsh/client-panel/install-into-profile.mjs` only INSTALL THE PACKAGE.
- insert:
    # >>> bundle-owned rows (see buildNotesAssistantPatch) >>>
    #
    # The two rows below are the FLAT channel's copies of what the installed package already registers
    # through its own entry (`dsh-math-memory` → `host/index.mjs`, which calls applyPanel + applyWorkspace).
    # When that package IS a registered bundle in this profile, keeping these rows means TWO sources
    # register `/memory-panel/*` and auto-register the workspace ⇒ dsh refuses the whole profile with
    # `duplicate prefix route "/memory-panel"`. `buildNotesAssistantPatch` therefore DROPS everything
    # between these markers when the bundle is present; the row after them stays in both cases (the
    # client package is installed separately and is NOT part of the bundle's patch).
    - id: math-memory-workspace
      name: ./math-memory-workspace.mjs
      config:
        vaultPath: !!js process.env.DSH_WORKSPACE_ROOT ?? process.env.DSH_OBSIDIAN_VAULT
    - id: math-memory-panel
      name: ./math-memory-panel.mjs
    # <<< bundle-owned rows <<<
    - id: math-memory-client-panel
      name: '@dsh-math-memory/client-ui-memory-panel'

# The skin manager writes a global patch ($DSH_HOME/cordis.patch.yml) that
# inserts the ACTIVE web skin into EVERY profile. The obsidian profile
# intentionally lets it apply: the plugin mirrors every @linxin666 package
# from the web profile's node_modules via junctions (syncGlobalPackageLinks),
# so the skin package always resolves and the obsidian web UI follows the
# same skin the user picked for the main web profile. No id lists to keep.
#
# The skin CENTER UI (ui-skin-center + its settings card host
# ui-web-ui-settings) is optional and controlled by the Obsidian plugin's
# "启用皮肤中心" setting: when enabled, the plugin appends an extra `insert:`
# block for those two packages to THIS file at runtime (and only when a web
# profile exists to mirror them from). This base file mounts neither, so the
# default boot stays independent of the @linxin666 UI plugin family.
#
# dsh 0.1.5 / dsh-web-all 0.3.20: the aggregate web bundle now mounts its own
# `web-ui-skin-center` row, so on a machine carrying the aggregate this optional
# block is redundant (harmless: the host half runs once, the browser half is
# deduped by package name). It remains the only route to a skin picker on a
# `web` profile that has the skin packages but no aggregate. See
# docs/dsh-0.1.5-adaptation.md §3.5 and §4 B2.
