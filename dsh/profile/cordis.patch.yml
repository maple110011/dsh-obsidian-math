# Obsidian mode patch layer, applied after dsh-base + dsh-web-app.
#
# A patch replaces the targeted row's whole config, so each row below
# restates the keys it owns.

# The agent this profile defaults to: file read/write/search, dedicated note
# tools (note_search / note_create / note_links), ask_user, plus the
# cross-session memory plugin.
- id: agent-presets
  config:
    default: obsidian
    includeUserRoot: true

# Confine every model write to the Obsidian vault (reads stay unrestricted,
# matching the harness read model). Set DSH_OBSIDIAN_VAULT to override the
# machine-local default without editing this file.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_OBSIDIAN_VAULT ?? process.cwd()

# Default relative-path root for the filesystem backend.
- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_OBSIDIAN_VAULT ?? process.cwd()

# Fail-closed approval: the Obsidian mode never pops an "escalate to
# danger-full-access?" prompt, so an accidental click cannot widen the write
# boundary. Setting DSH_PERMISSION_MODE=danger-full-access explicitly (and
# restarting) re-enables those prompts (approval: ask); the sandbox itself
# stays workspace-write, so every widening beyond the vault still needs an
# explicit per-operation confirmation.
# NOTE: keep the folded-block `!!js >-` form — inline `? :` ternaries are
# mis-parsed by js-yaml into a mapping ({...: 'never'}).
- id: approval
  config:
    policy: !!js >-
      (process.env.DSH_PERMISSION_MODE ?? 'workspace-write') ===
      'danger-full-access' ? 'ask' : 'never'

# The permission preset table must describe the composed default
# (workspace-write sandbox + never approval), otherwise boot fails with
# "composed sandbox and approval defaults match no preset".

# UI aesthetics only (no agent tools added): the dsh-web-ui skin center
# brings the skin picker and the background-opacity control
# (skin-background settings namespace). The skin center card renders inside
# the "Web UI plugins" group card on the settings page, and that group card
# is provided by ui-web-ui-settings — so the group entry is mounted too.
# Both entries are pure UI (a settings-page card and a loopback-only
# settings bridge); neither adds an agent tool. The rest of the dsh-web-ui
# family (task-board / ssh / aionui-panel / git-graph / pet / live-stats /
# remote-web-ui) is deliberately NOT mounted here — the obsidian mode keeps
# the minimal tool surface and only keeps the skin capability for looks.
# The skin choice is shared with the main web profile (both write the same
# $DSH_HOME/cordis.patch.yml managed section).
- insert:
    - id: ui-web-ui-settings
      name: '@linxin666/dsh-client-ui-web-ui-settings'
    - id: ui-skin-center
      name: '@linxin666/dsh-client-ui-skin-center'

- id: permission
  config:
    defaultPreset: obsidian-locked
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      obsidian-locked:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never
