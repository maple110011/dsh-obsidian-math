# Obsidian mode patch layer, applied after dsh-base + dsh-web-app.
#
# A patch replaces the targeted row's whole config, so each row below
# restates the keys it owns.

# The agent this profile defaults to: file read/write/search, dedicated note
# tools (note_search / note_create / note_links), ask_user, plus the
# cross-session memory plugin.
- id: agent-presets
  config:
    default: notes-assistant
    includeUserRoot: true

# Confine every model write to the Obsidian vault (reads stay unrestricted,
# matching the harness read model). Set DSH_OBSIDIAN_VAULT to override the
# machine-local default without editing this file.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_WORKSPACE_ROOT ?? process.env.DSH_OBSIDIAN_VAULT ?? process.cwd()

# Default relative-path root for the filesystem backend.
- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_WORKSPACE_ROOT ?? process.env.DSH_OBSIDIAN_VAULT ?? process.cwd()

# Fail-closed approval: the Obsidian mode never pops an "escalate to
# danger-full-access?" prompt, so an accidental click cannot widen the write
# boundary. Setting DSH_PERMISSION_MODE=danger-full-access explicitly (and
# restarting) re-enables those prompts (approval: ask); the sandbox itself
# stays workspace-write, so every widening beyond the vault still needs an
# explicit per-operation confirmation.
# NOTE: keep the folded-block `!!js >-` form — inline `? :` ternaries are
# mis-parsed by js-yaml into a mapping ({...: 'never'}).
- id: approval
  config:
    policy: !!js >-
      (process.env.DSH_PERMISSION_MODE ?? 'workspace-write') ===
      'danger-full-access' ? 'ask' : 'never'

# The permission preset table must describe the composed default
# (workspace-write sandbox + never approval), otherwise boot fails with
# "composed sandbox and approval defaults match no preset".

# UI aesthetics: the dsh-web-ui skin center (ui-skin-center) and its card host
# (ui-web-ui-settings) are NOT mounted here. The Obsidian plugin can mount them
# optionally (settings.enableSkinCenter) by appending an insert block to the
# notes-assistant.patch.yml overlay at runtime. The default stays independent
# of the dsh-web-ui plugin family, so it has no @linxin666 packages to resolve
# and boots even without a `web` profile.

- id: permission
  config:
    defaultPreset: math-memory-locked
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      math-memory-locked:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never
